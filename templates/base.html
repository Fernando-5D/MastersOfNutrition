<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>{% block title %}Plantilla Base{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="static/estilos.css">

</head>
<body style="background-color:rgb(127, 199, 127)">
<header class="bg-black p-4">
    <div class="container d-flex justify-content-between align-items-center">
    <h1 class="text-white">Elige a donde ir.</h1>
    <nav>
    <a href="/" class="link-success">Inicio</a> |
    <a href="/registro" class="link-success">Registrarse</a> |
    
    {% if session.get("correo") %}
            <a href="{{ url_for('cerrarSesion') }}" class="link-success">Cerrar sesión</a>
            {% else %}
            <a href="/sesion" class="link-success">Iniciar sesión</a>
    {% endif %}
    </nav>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="text-center bg-black p-4 mt-auto">
    <p class="text-white">Todos los derechos reservados.</p>
</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
